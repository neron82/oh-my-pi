name: fork-verify

# Verification net for the prompt-cache-stability fork: every push to the
# integration branch (including the merge commits produced by
# scripts/integrate-upstream.ts) is type-checked and run through the fork's
# stability test suite + the integration-script contract tests.
#
# Guarded to run only on forks of upstream (never on can1357/oh-my-pi itself).
# Merging upstream happens on the user's machine (the build/deploy stage needs
# a local environment); this workflow only verifies.

on:
  push:
    branches: [prompt-cache-stability]
    paths:
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - "bun.lock"
      - "package.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fork-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-integration:
    runs-on: ubuntu-latest
    if: github.repository_owner != 'can1357'
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Upstream's test jobs install the same set before loading the addon and running suites; stock
      # runners do not have it (the omp-kata image does, and the action detects that and skips).
      - uses: ./.github/actions/setup-system-deps

      - name: Install dependencies
        run: bun install

      # The stability suites import the coding agent, which loads the pi_natives addon the moment it
      # is imported; with no addon present the loader throws (packages/natives/native/loader-state.js)
      # and the job dies before running a single test - which is what every push to this branch did
      # until this step existed, leaving the type-check and every suite below it skipped.
      #
      # The fork has no bazel cluster, so this follows upstream's pull-request path (ci.yml): take the
      # published Linux x64 pair from the npm leaf rather than building it, and put it where the
      # loader looks first. The workspace loader skips its version sentinel for workspace loads, so a
      # release addon loads fine under a newer checkout; a change that genuinely depends on new native
      # behaviour then fails here visibly instead of silently passing.
      - name: Fetch release native addons
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          echo "Fetching $tarball"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/

      # A corrupt or incompatible download must fail on its own line, not as a confusing dlopen error
      # in the middle of a suite. `bun -e 'require(...)'` swallows dlopen failures, hence a script
      # file (the same trap upstream's smoke step documents).
      - name: Smoke the native addons
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
          for (const f of process.argv.slice(2)) {
           const m = require(f);
           if (!m || Object.keys(m).length === 0) {
           	console.error(`addon failed to load: ${f}`);
           	process.exit(1);
           }
          }
          EOF
          bun "$RUNNER_TEMP/smoke-addons.js" \
            "$PWD/packages/natives/native/pi_natives.linux-x64-modern.node" \
            "$PWD/packages/natives/native/pi_natives.linux-x64-baseline.node"

      - name: Integration script contract tests
        run: bun test scripts/integrate-upstream.test.ts

      - name: Fork stability test suite
        run: >
          bun test
          packages/agent/test/prompt-stability.test.ts
          packages/agent/test/prompt-stability-turns.test.ts
          packages/agent/test/kv-aligned-compaction.test.ts
          packages/coding-agent/test/append-only-context-mode.test.ts
          packages/coding-agent/test/agent-session-snapcompact-budget.test.ts
          packages/coding-agent/test/claude-trace-proxy.test.ts
          packages/coding-agent/test/debug/dap-frame-overflow.test.ts
          packages/coding-agent/test/jsonrpc-message-framing.test.ts
          packages/coding-agent/test/lsp-mux.test.ts
          packages/coding-agent/test/mcp-render-status.test.ts
          packages/coding-agent/test/session/advisor-stability.test.ts
          packages/coding-agent/test/session/llm-request-dump-sidecar.test.ts
          packages/coding-agent/test/session/session-dump-format.test.ts
          packages/coding-agent/test/status-line-usage-line.test.ts

      - name: Type-check workspace
        run: bun run check:ts